name: job-watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: job-watch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Israeli Tech Map (companies + jobs only)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/mluggy/techmap.git techmap
          git -C techmap sparse-checkout set companies jobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - run: python watch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save state
        run: |
          git config user.name job-watch-bot
          git config user.email job-watch-bot@users.noreply.github.com
          git add seen.json
          git commit -m "update seen" || exit 0
          git pull --rebase
          git push
