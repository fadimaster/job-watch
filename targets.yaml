# job-watch targets. Edit on github.com: open targets.yaml > pencil icon > commit.
#
# Where companies come from:
#   1) The "companies" list below (checked every run).
#   2) Israeli Tech Map (techmap section): ~185 more companies added automatically,
#      e.g. Silverfort, Trigo, Cellebrite, BioCatch, Fetcherr, Checkmarx, Island, Mixtiles,
#      Lightricks, JFrog, Tipalti, Transmit Security. No need to list those here.
#      If a company appears in both, the line below wins.
#
# Supported "ats" values and what each line needs:
#   greenhouse:      board            (+ region: eu if the link has job-boards.eu.greenhouse.io)
#   lever:           board            (+ region: eu)
#   ashby:           board
#   workable:        board
#   smartrecruiters: board
#   breezy:          board
#   workday:         host, tenant, site
#   comeet:          slug, uid        (no token needed)
#
# How to read them from a company's job link:
#   job-boards.greenhouse.io/daylightsecurity     -> ats: greenhouse, board: daylightsecurity
#   job-boards.eu.greenhouse.io/scaleops          -> ats: greenhouse, board: scaleops, region: eu
#   jobs.lever.co/acme                            -> ats: lever, board: acme
#   jobs.ashbyhq.com/acme                         -> ats: ashby, board: acme
#   apply.workable.com/acme                       -> ats: workable, board: acme
#   acme.breezy.hr                                -> ats: breezy, board: acme
#   comeet.com/jobs/moovit/63.007                 -> ats: comeet, slug: moovit, uid: "63.007"
#   nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#                                                 -> ats: workday, host: nvidia.wd5.myworkdayjobs.com,
#                                                    tenant: nvidia, site: NVIDIAExternalCareerSite
#
# Optional per company:  remote_ok: false  -> only alert for Israel locations at that company
# If a line is wrong you get one "Feed check" issue a week listing it. Fix or delete the line.

# digest: true -> one alert per run listing all new jobs (false = one alert per job)
digest: true

# Israeli Tech Map (github.com/mluggy/techmap)
techmap:
  enabled: true
  all_israel: true      # Tech Map jobs anywhere in Israel (false = only the cities listed under locations)
  max_age_days: 21      # ignore Tech Map jobs older than this

filters:
  titles:
    - '\bIT\b.*\b(manager|director|lead|head)\b'
    - '\b(head|director|vp|vice president)\b.*\b(IT|information technology|corporate IT|IT operations|information security|corporate security|infrastructure)\b'
    - 'information technology manager'
    - '\bCIO\b'
    - 'infrastructure (team )?manager'
  exclude:
    - 'intern|student|junior|technician|help ?desk|support specialist'
    - 'sales|account executive|marketing|recruit'
  locations:
    - 'israel|tel[ -]?aviv|ramat[ -]?gan|herzliya|petah|petach|givatayim|bnei[ -]?brak|holon'
    - "ra'?anana|hod hasharon|rosh ha'?ayin|or yehuda|jaffa|yafo|kfar saba|netanya|rehovot|ness ziona|kadima"
    - 'תל אביב|רמת גן|הרצליה|פתח תקו|גבעתיים|בני ברק|חולון|רעננה|הוד השרון|ראש העין|אור יהודה|יפו|כפר סבא|נתניה|רמת השרון|ראשון לציון|לוד|רחובות'
  remote:
    - 'remote|anywhere|worldwide|emea|europe'
  remote_block:
    - 'us only|united states|\busa\b|u\.s\.|north america|canada only|americas only'

companies:
  # ---- Israel: confirmed on the companies' official boards ----
  - {name: Aidoc,             ats: greenhouse, board: aidocmedical,     region: eu}
  - {name: Daylight Security, ats: greenhouse, board: daylightsecurity}
  - {name: Eon,               ats: greenhouse, board: eonio,            region: eu}
  - {name: Optimove,          ats: greenhouse, board: optimove,         region: eu}
  - {name: ScaleOps,          ats: greenhouse, board: scaleops,         region: eu}
  - {name: Moovit,            ats: comeet,     slug: moovit,            uid: "63.007"}
  - {name: NVIDIA,            ats: workday,    host: nvidia.wd5.myworkdayjobs.com, tenant: nvidia, site: NVIDIAExternalCareerSite, remote_ok: false}

  # ---- Israel: best guesses (a wrong one shows up in the weekly Feed check issue) ----
  - {name: Thales,            ats: workday,    host: thales.wd3.myworkdayjobs.com, tenant: thales, site: Careers, remote_ok: false}
  - {name: Wiz,               ats: greenhouse, board: wizinc}
  - {name: Rubrik,            ats: greenhouse, board: rubrik}
  - {name: Armis,             ats: greenhouse, board: armissecurity}
  - {name: Pagaya,            ats: greenhouse, board: pagaya}
  - {name: Via,               ats: greenhouse, board: via}
  - {name: Payoneer,          ats: greenhouse, board: payoneer}
  - {name: Melio,             ats: greenhouse, board: melio}
  - {name: AppsFlyer,         ats: greenhouse, board: appsflyer}
  - {name: Torq,              ats: greenhouse, board: torq}

  # ---- Remote-first companies (remote roles open to EMEA) ----
  - {name: Testlio,           ats: greenhouse, board: testlio}
  - {name: Sporty Group,      ats: greenhouse, board: sportygroup,      region: eu}
  - {name: GitLab,            ats: greenhouse, board: gitlab}
  - {name: Canonical,         ats: greenhouse, board: canonical}
  - {name: Grafana Labs,      ats: greenhouse, board: grafanalabs}
  - {name: PostHog,           ats: ashby,      board: posthog}
  - {name: Deel,              ats: ashby,      board: deel}
  - {name: 1Password,         ats: ashby,      board: 1password}
